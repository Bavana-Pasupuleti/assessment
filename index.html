<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Congratulations on your first day at Waymo, Hero!">
<title>Welcome to Waymo, Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
  /* Layout: one centered column. Big stretched headline, the video as the stage, short message, confetti button. */
  :root {
    --bg: #effafa;
    --fg: #08262e;
    --muted: #3d6169;
    --teal: #00a3a1;
    --blue: #1a73e8;
    --amd-red: #e8202a;
    --card: #ffffff;
    --line: #bfe3e4;
    --font-display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
    --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #04181d;
      --fg: #e6f7f7;
      --muted: #8dbcc2;
      --teal: #2fd0cd;
      --blue: #6aa6ff;
      --amd-red: #ff4b53;
      --card: #0b2a31;
      --line: #164650;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #04181d;
    --fg: #e6f7f7;
    --muted: #8dbcc2;
    --teal: #2fd0cd;
    --blue: #6aa6ff;
    --amd-red: #ff4b53;
    --card: #0b2a31;
    --line: #164650;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { color-scheme: light; }
  video { max-width: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 1.0625rem;
    line-height: 1.6;
    padding-block: 2.5rem 3rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow-x: hidden;
  }
  #confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
  }
  main {
    max-width: 62rem;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
    text-align: center;
  }

  .route {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    font-weight: 700;
    font-size: 0.8125rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .route .amd { color: var(--amd-red); }
  .route .waymo { color: var(--teal); }
  .route svg { width: 2.5rem; height: 0.75rem; }

  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.02em;
    text-wrap: balance;
    display: flex;
    flex-direction: column;
    gap: 0.15em;
  }
  .l1 {
    font-size: clamp(1.4rem, 6.6vw, 4.25rem);
    color: var(--teal);
    overflow-wrap: anywhere;
  }
  .l2 {
    font-size: clamp(2.6rem, 14vw, 9rem);
    color: var(--fg);
  }
  .l2 .bang { color: var(--amd-red); }
  .wave span {
    display: inline-block;
    animation: hop 2.4s ease-in-out infinite;
    animation-delay: calc(var(--i) * 70ms);
  }
  @keyframes hop {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-0.12em); }
  }

  .stage {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 1.25rem;
    padding: 0.5rem;
    box-shadow: 0 1.5rem 3rem -1.5rem color-mix(in srgb, var(--teal) 55%, transparent);
  }
  .stage video {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 0.875rem;
    background: #000;
  }

  .message {
    max-width: 40rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .message p { margin: 0; }
  .message .lead {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(1.25rem, 3.2vw, 1.75rem);
    line-height: 1.25;
    text-wrap: balance;
  }
  .message .lead em {
    font-style: normal;
    color: var(--amd-red);
  }
  .message .body { color: var(--muted); text-wrap: pretty; }

  .merch {
    font: inherit;
    font-weight: 700;
    color: #fff;
    background: var(--teal);
    border: 0;
    border-radius: 999px;
    padding: 0.9rem 1.75rem;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  :root[data-theme="dark"] .merch { color: #04181d; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .merch { color: #04181d; }
  }
  .merch:hover { transform: translateY(-2px) scale(1.03); }
  .merch:active { transform: scale(0.97); }
  .merch:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  .merch-note {
    min-height: 1.6em;
    margin: 0;
    font-size: 0.9375rem;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    .wave span { animation: none; }
  }
</style>

</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>

<main>
  <div class="route" aria-label="From AMD to Waymo">
    <span class="amd">AMD</span>
    <svg viewBox="0 0 40 12" fill="none" aria-hidden="true">
      <path d="M1 6h36M31 1l6 5-6 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="waymo">Waymo</span>
  </div>

  <h1>
    <span class="l1 wave" id="line1" aria-label="CONGRATULATIONSSSSS"></span>
    <span class="l2">HEROOO<span class="bang">!!!!</span></span>
  </h1>

  <div class="stage">
    <video id="vid" src="waymo_amd_animation.mp4" autoplay muted loop playsinline controls preload="auto"></video>
  </div>

  <section class="message">
    <p class="lead">You worked crazy hard for 5 years at <em>AMD</em>. Now it's time for the people at Waymo to see your talents and how cool you are.</p>
    <p class="body">Have an amazing, happy and productive time here. Looking forward to the Waymo merch, lolol.</p>
  </section>

  <div>
    <button class="merch" id="merch" type="button">Where's my merch?</button>
    <p class="merch-note" id="note" role="status"></p>
  </div>
</main>

<script>
  // Stretched headline, one span per letter so it can hop in a wave
  var text = "CONGRATULATIONSSSSS";
  var line1 = document.getElementById("line1");
  for (var i = 0; i < text.length; i++) {
    var s = document.createElement("span");
    s.textContent = text[i];
    s.style.setProperty("--i", i);
    s.setAttribute("aria-hidden", "true");
    line1.appendChild(s);
  }

  // Confetti
  var cvs = document.getElementById("confetti");
  var ctx = cvs.getContext("2d");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var parts = [];
  var running = false;

  function size() {
    var d = window.devicePixelRatio || 1;
    cvs.width = innerWidth * d;
    cvs.height = innerHeight * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  addEventListener("resize", size);
  size();

  function colors() {
    var cs = getComputedStyle(document.documentElement);
    return ["--teal", "--blue", "--amd-red", "--fg"].map(function (v) { return cs.getPropertyValue(v).trim(); });
  }

  function burst(n) {
    if (reduce) return;
    var cols = colors();
    for (var i = 0; i < n; i++) {
      var fromLeft = i % 2 === 0;
      parts.push({
        x: fromLeft ? 0 : innerWidth,
        y: innerHeight * 0.75,
        vx: (fromLeft ? 1 : -1) * (4 + Math.random() * 9),
        vy: -(10 + Math.random() * 12),
        w: 6 + Math.random() * 6,
        h: 3 + Math.random() * 5,
        r: Math.random() * 6.28,
        vr: (Math.random() - 0.5) * 0.4,
        c: cols[(Math.random() * cols.length) | 0],
        life: 0
      });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }

  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vy += 0.32; p.vx *= 0.99;
      p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
      if (p.y > innerHeight + 20) parts.splice(i, 1);
    }
    if (parts.length) requestAnimationFrame(tick);
    else { running = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  setTimeout(function () { burst(90); }, 400);

  var lines = [
    "Merch order status: pending. HR has been notified (not really).",
    "Still pending. Hoodie size: legend.",
    "A tote bag, a hoodie and a sticker pack are being manifested.",
    "Merch ETA: right after the next big launch."
  ];
  var n = 0;
  document.getElementById("merch").addEventListener("click", function () {
    document.getElementById("note").textContent = lines[n++ % lines.length];
    burst(140);
  });

  // Some browsers pause autoplay; try once more if the video didn't start
  var v = document.getElementById("vid");
  v.play && v.play().catch(function () {});
</script>
</body>
</html>
